<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse Genie — local</title>
  <!-- No external font CDN on purpose: "nothing leaves the machine" and this
       must work fully offline / packaged in Electron. The stylesheet falls back
       to the system UI + monospace stacks (system-ui / ui-monospace). -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="mark">
        <div class="mark-lamp" aria-hidden="true"></div>
        <div>
          <div class="mark-name">Warehouse Genie</div>
          <div class="mark-sub">local · self-hosted</div>
        </div>
      </div>

      <nav class="nav">
        <a href="#/chat" data-route="chat" class="nav-item">Ask</a>
        <a href="#/pack" data-route="pack" class="nav-item">Context pack</a>
      </nav>

      <div class="sidebar-foot">
        <div class="health" id="health-databricks">
          <span class="dot"></span>
          <span class="health-name">Databricks</span>
          <span class="health-detail" title=""></span>
        </div>
        <div class="health" id="health-ollama">
          <span class="dot"></span>
          <span class="health-name">Ollama</span>
          <span class="health-detail" title=""></span>
        </div>
        <button class="btn btn-ghost btn-block" id="btn-settings">Settings</button>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
